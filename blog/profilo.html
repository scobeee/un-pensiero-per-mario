<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=800">
    <title>Profilo - Il Blog dei Mario</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="blog.js"></script>
</head>
<body>

<div id="top-marquee"><span>★ PROFILO UTENTE ★ Guarda cosa scrive questo Mario! ★</span></div>

<div id="main-header">
    <h1>✦ Il Blog dei Mario ✦</h1>
    <div class="tagline">~ La casa digitale di tutti i Mario ~</div>
</div>

<div id="navbar"><div id="navbar-container"></div></div>

<table id="layout-table" cellpadding="0" cellspacing="4">
<tr>
    <td class="sidebar-left">
        <div class="widget-box"><div class="widget-title">👁 Visite</div><div class="widget-content" style="text-align:center;"><div id="visitor-counter">000000</div></div></div>
    </td>
    <td class="content-center">
        <div class="content-box">
            <div class="content-box-title">👤 PROFILO DI <span id="profile-name">...</span></div>
            <div id="profile-container" style="padding:20px;">Caricamento...</div>
        </div>
    </td>
    <td class="sidebar-right">
        <div class="widget-box"><div class="widget-title">📊 Sondaggio</div><div id="sidebar-poll-content" class="widget-content" style="font-size:10px;"></div></div>
    </td>
</tr>
</table>

<div id="main-footer">
    <div class="ie-disclaimer">★ Best viewed in IE 6.0 ★ | © 2003 Il Blog dei Mario</div>
</div>

<script>
    var username = new URLSearchParams(window.location.search).get('username');
    var user = getUserByUsername(username);

    if (!user) {
        document.getElementById('profile-container').innerHTML = '<div style="color:red;">❌ Utente non trovato!</div>';
        return;
    }

    document.getElementById('profile-name').textContent = user.name.toUpperCase();
    var posts = getPostsByUser(username);

    document.getElementById('profile-container').innerHTML = `
        <div style="text-align:center; margin-bottom:20px;">
            <div style="font-size:80px;">${user.avatar}</div>
            <div style="font-size:28px; font-weight:bold;">${user.name} (@${user.username})</div>
            <div style="font-size:12px; color:#666;">Iscritto dal: ${user.joinDate}</div>
        </div>
        <div style="font-size:13px; line-height:1.5;"><strong>Bio:</strong><br>${escapeHtml(user.bio)}</div>
        <h3 style="margin-top:20px; color:#000080;">Post di ${user.name.split(' ')[0]} (${posts.length}):</h3>
        <div id="profile-posts"></div>
    `;

    document.getElementById('profile-posts').innerHTML = posts.map(p => `
        <div class="post-preview">
            <div class="post-title"><a href="post.html?id=${p.id}">${p.title}</a></div>
            <div class="post-excerpt">${p.excerpt}</div>
            <a class="read-more" href="post.html?id=${p.id}">Leggi »</a>
        </div>
    `).join('');
function escapeHtml(text) { var d = document.createElement('div'); d.appendChild(document.createTextNode(text)); return d.innerHTML; }
</script>

</body>
</html>
